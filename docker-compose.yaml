services:
  # PostgreSQL 18
  # URL: postgres://postgres:<POSTGRES_PASSWORD>@localhost:5433/waypoint
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-waypoint}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      # Initial migration; runs on empty volume only.
      - ./db/migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/000001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # PgAdmin 4 web UI
  # URL: http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:9.17
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-secret}
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGPASS_FILE: /config/pgpass
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    configs:
      - source: pgadmin-pgpass
        target: /config/pgpass
        uid: "5050"
        gid: "5050"
        mode: 0400
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
        mode: 0444

volumes:
  postgres_data:
  pgadmin_data:

configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Waypoint PostgreSQL",
            "Group": "Servers",
            "Host": "db",
            "Port": 5432,
            "MaintenanceDB": "${POSTGRES_DB:-waypoint}",
            "Username": "${POSTGRES_USER:-postgres}",
            "ConnectionParameters": {
              "sslmode": "prefer"
            }
          }
        }
      }
  pgadmin-pgpass:
    content: |
      db:5432:*:${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secret}
