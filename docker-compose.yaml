services:
  # PostgreSQL 18
  # URL: postgres://postgres:<POSTGRES_PASSWORD>@localhost:5433/waypoint
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waypoint}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Local Keycloak. Register your own account at /realms/waypoint/account/.
  # Waypoint issuer: http://localhost:8081/realms/waypoint; audience: waypoint-api.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      # This administrator belongs to the master realm, not the waypoint realm.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-secret}
      KEYCLOAK_FE_CLIENT_SECRET: ${KEYCLOAK_FE_CLIENT_SECRET:?Set KEYCLOAK_FE_CLIENT_SECRET in .env or the environment}
      KEYCLOAK_GOOGLE_CLIENT_ID: ${KEYCLOAK_GOOGLE_CLIENT_ID:?Set KEYCLOAK_GOOGLE_CLIENT_ID in .env or the environment}
      KEYCLOAK_GOOGLE_CLIENT_SECRET: ${KEYCLOAK_GOOGLE_CLIENT_SECRET:?Set KEYCLOAK_GOOGLE_CLIENT_SECRET in .env or the environment}
      KEYCLOAK_GITHUB_CLIENT_ID: ${KEYCLOAK_GITHUB_CLIENT_ID:?Set KEYCLOAK_GITHUB_CLIENT_ID in .env or the environment}
      KEYCLOAK_GITHUB_CLIENT_SECRET: ${KEYCLOAK_GITHUB_CLIENT_SECRET:?Set KEYCLOAK_GITHUB_CLIENT_SECRET in .env or the environment}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    configs:
      - source: keycloak-realm
        target: /opt/keycloak/data/import/waypoint-realm.json
        mode: 0644 # -rw-r--r--
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /realms/waypoint/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          IFS= read -r status <&3
          [[ "$$status" == *" 200 "* ]]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # PgAdmin 4 web UI
  # URL: http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:9.17
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-secret}
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGPASS_FILE: /config/pgpass
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    configs:
      - source: pgadmin-pgpass
        target: /config/pgpass
        uid: "5050"
        gid: "5050"
        mode: 0400 # -r--------
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
        mode: 0444 # -r--r--r--

volumes:
  postgres_data:
  pgadmin_data:
  keycloak_data:

configs:
  # Imported only when the realm does not exist. Later changes can be made in
  # the Keycloak admin console; restarting preserves existing users and settings.
  # Built-in scope definitions were exported from Keycloak 26.7.3. Supplying
  # clientScopes replaces automatic default creation, so retain them here.
  keycloak-realm:
    file: ./tests/testlib/testdata/waypoint-dev-realm.json
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Waypoint PostgreSQL",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "${POSTGRES_DB:-waypoint}",
            "Username": "${POSTGRES_USER:-postgres}",
            "ConnectionParameters": {
              "sslmode": "prefer"
            }
          }
        }
      }
  pgadmin-pgpass:
    content: |
      postgres:5432:*:${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secret}
